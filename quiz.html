<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoQuiz - Ultimate Car Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">AutoQuiz</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="quiz.html" class="active">Quiz</a>
        </nav>
    </header>

    <main class="landing-container">
        
        <!--Guys just be careful with the styling here -->
        <!-- ACTIVE QUIZ SCREEN (Single Flow: Easy -> Medium -> Difficult) -->
        <section id="quiz-screen" class="hero fade-in">
            
            <!-- Level Indicator Badge & Question Counter -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <span id="level-badge" class="logo" style="font-size: 1.1rem; background: var(--border-color); padding: 0.3rem 0.8rem; border-radius: 20px;">
                    Level: Easy
                </span>
                <span id="question-tracker" style="color: var(--text-muted); font-weight: 600;">
                    Question 1 of 10
                </span>
            </div>

            <!-- Progress Bar Visualization -->
            <div class="progress-container">
                <div class="progress-bar-background">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- Dynamic Question Container -->
            <div id="question-container" style="margin: 2rem 0;">
                <h2 id="question-text">Loading question...</h2>
            </div>

            <!-- Answer Options Grid (Reuses feature-card styling) -->
            <div id="answer-options" class="features" style="margin-top: 1.5rem;">
                <div class="feature-card option-card" data-index="0">
                    <p class="option-text">Option 1</p>
                </div>
                <div class="feature-card option-card" data-index="1">
                    <p class="option-text">Option 2</p>
                </div>
                <div class="feature-card option-card" data-index="2">
                    <p class="option-text">Option 3</p>
                </div>
                <div class="feature-card option-card" data-index="3">
                    <p class="option-text">Option 4</p>
                </div>
            </div>

            <!-- Controls -->
            <div style="margin-top: 2rem;">
                <button id="next-btn" class="btn-primary" disabled>Next Question</button>
            </div>
        </section>

        <!-- RESULTS SCREEN (Hidden by default, shown via JS at the end) -->
        <section id="results-screen" class="hero fade-in" style="display: none;">
            <h1>Quiz Completed!</h1>
            <p id="final-score" style="font-size: 1.6rem; font-weight: bold; margin: 1rem 0; color: var(--primary-red);">
                You scored 0 out of 10
            </p>
            <p id="feedback-message">Great attempt on the car trivia!</p>

            <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="quiz.html" class="btn-cta">Try Again</a>
                <a href="index.html" class="btn-primary" style="background-color: var(--text-muted);">Back to Home</a>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 AutoQuiz. Built for gearheads and car enthusiasts.</p>
    </footer>

    <!-- LINK TO JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
